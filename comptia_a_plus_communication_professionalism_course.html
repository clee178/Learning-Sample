  {q:"A user is yelling about a recurring problem. What should you do first?",opts:["Tell them you'll fix it and hang up","Apologize and let them vent while actively listening","Immediately transfer them to a supervisor","Explain why the problem keeps happening"],ans:1,fb:"De-escalation starts with acknowledgment. Let the customer express their frustration, apologize sincerely, then move toward solving the problem."},
  {q:"A customer says 'my internet keeps going out.' What's the best follow-up question?",opts:["Have you tried restarting your router?","Can you walk me through exactly what happens — when does it drop?","Is it a hardware or software issue?","Did you recently change any settings?"],ans:1,fb:"Open-ended questions ('walk me through what happens') surface more accurate information than yes/no or leading questions. Avoid jumping to solutions before fully understanding the problem."},
  {q:"You discover illegal content on a user's device while performing repairs. What do you do?",opts:["Delete it to protect the user","Tell the user what you found","Report it to your supervisor following your organization's incident response policy","Document it in the ticket and continue working"],ans:2,fb:"The correct action is always to report through proper channels. Don't touch the content, don't tell the user, and don't investigate yourself. Chain of custody matters legally."},
  {q:"Before leaving after a repair, what should you always do?",opts:["Ask the user to sign a release form","Have the user confirm the issue is resolved","Tell them to call back if it breaks again","Update the ticket with your solution"],ans:1,fb:"Never close an interaction without user confirmation of resolution. While updating the ticket is also required, the immediate final step is confirming with the customer that the problem is fixed."},
  {q:"A technician is working on a user's PC and notices documents with sensitive financial information on the desktop. What is the correct action?",opts:["Review them to make sure they're backed up","Ignore them and focus only on the task at hand","Ask the user if they need help organizing their files","Mention to the user that their files are visible to anyone"],ans:1,fb:"The principle of minimum necessary access means you only engage with what's required to complete your task. Viewing, commenting on, or engaging with sensitive data you don't need to see violates privacy best practices."},
  {q:"A user asks when their laptop will be ready. You're not sure yet. What's the best response?",opts:["'I don't know — it depends on the problem'","'It should be done soon'","'I'll have a full diagnosis by noon and will call you with a timeline at that point'","'These things take as long as they take'"],ans:2,fb:"Always give a specific next step and time commitment. Vague answers like 'soon' or 'I don't know' erode trust. Commit to when you'll have more information, then honor that commitment."},
  {q:"Which phrase best demonstrates positive professional language?",opts:["'That's not my department'","'I can't get to that until next week'","'Let me connect you with the right person who handles that'","'You should have reported this sooner'"],ans:2,fb:"Reframe every limitation as a positive action you're taking. 'Let me connect you' shows ownership and helpfulness, while 'not my department' feels dismissive and unprofessional."},
  {q:"A technician closes a ticket because they believe the issue is fixed without contacting the customer. This is:",opts:["Acceptable if the fix was obvious","Acceptable if the ticket has been open more than 24 hours","A violation of proper resolution procedures","Fine as long as the documentation is complete"],ans:2,fb:"Tickets must never be closed without customer confirmation. The customer defines resolution, not the technician. Always verify with the user before closing."},
  {q:"What is the purpose of a 'warm transfer' when escalating?",opts:["Transferring calls faster to reduce hold time","Introducing the customer to the next technician and briefing them before stepping away","Keeping the customer on hold while you brief the next tech","Having the customer explain the problem again to the new tech"],ans:1,fb:"A warm transfer means the customer never has to repeat themselves. You stay on the line, introduce the customer to the escalation contact, provide a full brief, and only then step away. Cold transfers are one of the biggest customer frustration drivers."},
  {q:"You solve a complex issue that took 3 hours to troubleshoot. What should you do before closing the ticket?",opts:["Close it quickly so your metrics look good","Document only the final solution to keep the ticket concise","Document the problem description, all steps tried, the root cause, and the solution — then consider writing a knowledge base article","Ask your supervisor if documentation is required for this type of issue"],ans:2,fb:"Every complex resolved issue is an opportunity to prevent future recurrence. Document fully and contribute to the knowledge base when appropriate. This is a mark of a professional technician."}
];

let current = 0;
let completed = new Set();
let quizAnswers = [];
let quizStep = 0;
let quizDone = false;

function renderNav(){
  const nav = document.getElementById('nav');
  nav.innerHTML = modules.map((m,i)=>`
    <div class="nav-item ${i===current?'active':''} ${completed.has(i)?'done':''}" onclick="go(${i})">
      <span class="nav-title">${m.title}</span>
      <span class="nav-status">${completed.has(i)?'✓ Complete': i===current?'In progress':'Not started'}</span>
    </div>
  `).join('');
}

function go(i){
  current=i;
  renderNav();
  renderMain();
  document.getElementById('main-area').scrollTop=0;
}

function renderMain(){
  const m = modules[current];
  const area = document.getElementById('main-area');
  if(m.type==='quiz'){renderQuiz();return;}
  if(m.type==='reflection'){renderReflection();return;}
  
  let html = `<div class="lesson-view">
    <div class="lesson-tag">${m.tag}</div>
    <div class="lesson-title">${m.title}</div>
    <div class="lesson-sub">${m.sub}</div>`;
  
  m.sections.forEach(s=>{
    if(s.tip){
      html+=`<div class="tip"><strong>Exam tip: </strong>${s.body}</div>`;
      return;
    }
    if(s.warn){
      html+=`<div class="warn"><strong>Important: </strong>${s.body}</div>`;
      return;
    }
    html+=`<div class="section-h">${s.h}</div>`;
    if(s.cards){
      s.cards.forEach(c=>{
        html+=`<div class="card"><div class="card-title">${c.t}</div><div class="card-body">${c.b}</div></div>`;
      });
    }
    if(s.scenarios){
      s.scenarios.forEach((sc,si)=>{
        html+=`<div class="scenario">
          <div class="scenario-label">Scenario ${si+1}</div>
          <div class="scenario-text">${sc.q}</div>
          <button class="reveal-btn" onclick="reveal(this)">Show best approach</button>
          <div class="scenario-answer">${sc.a}</div>
        </div>`;
      });
    }
  });
  
  html+=`</div>`;
  
  const prog = Math.round(completed.size/modules.length*100);
  const isLast = current===modules.length-1;
  const nextLabel = current===9?'Take the test':'Next lesson →';
  
  area.innerHTML = html+`
    <div class="bottom-bar">
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
        <span style="font-size:12px;color:var(--color-text-tertiary);white-space:nowrap">${prog}% complete</span>
      </div>
      ${current>0?`<button class="btn-sec" onclick="go(${current-1})">← Back</button>`:''}
      ${current<modules.length-1?`<button class="btn-primary" onclick="advance()">${nextLabel}</button>`:''}
    </div>`;
}

function reveal(btn){
  const ans = btn.nextElementSibling;
  ans.classList.toggle('show');
  btn.textContent = ans.classList.contains('show')?'Hide answer':'Show best approach';
}

function advance(){
  completed.add(current);
  go(current+1);
}

function renderQuiz(){
  if(quizDone){renderScore();return;}
  const area = document.getElementById('main-area');
  const q = quizData[quizStep];
  const prog = Math.round(quizStep/quizData.length*100);
  area.innerHTML=`
    <div class="quiz-view">
      <div class="lesson-tag">Knowledge Check</div>
      <div class="lesson-title">Take Test</div>
      <div style="margin-top:20px">
        <div class="q-num">Question ${quizStep+1} of ${quizData.length}</div>
        <div class="q-text">${q.q}</div>
        ${q.opts.map((o,i)=>`<div class="q-opt" id="opt${i}" onclick="selectOpt(${i})">${o}</div>`).join('')}
        <div class="q-feedback" id="qfb"></div>
      </div>
    </div>
    <div class="bottom-bar">
      <div style="display:flex;align-items:center;gap:10px;flex:1">
        <div class="progress-bar"><div class="progress-fill" style="width:${prog}%"></div></div>
        <span style="font-size:12px;color:var(--color-text-tertiary)">${quizStep+1}/${quizData.length}</span>
      </div>
      <button class="btn-primary" id="nextq" style="display:none" onclick="nextQ()">Next →</button>
    </div>`;
}

let selectedOpt = null;
function selectOpt(i){
  if(selectedOpt!==null)return;
  selectedOpt=i;
  const q = quizData[quizStep];
  quizAnswers.push(i===q.ans?1:0);
  document.querySelectorAll('.q-opt').forEach((el,idx)=>{
    if(idx===q.ans)el.classList.add('correct');
    else if(idx===i)el.classList.add('wrong');
    el.style.pointerEvents='none';
  });
  const fb = document.getElementById('qfb');
  fb.className='q-feedback show '+(i===q.ans?'ok':'no');
  fb.textContent=(i===q.ans?'✓ Correct — ':'✗ Incorrect — ')+q.fb;
  document.getElementById('nextq').style.display='block';
}

function nextQ(){
  selectedOpt=null;
  quizStep++;
  if(quizStep>=quizData.length){quizDone=true;completed.add(10);renderScore();}
  else renderQuiz();
}

function renderScore(){
  const area = document.getElementById('main-area');
  const score = quizAnswers.reduce((a,b)=>a+b,0);
  const pct = Math.round(score/quizData.length*100);
  const pass = pct>=70;
  area.innerHTML=`
    <div class="score-view">
      <div class="lesson-tag">Results</div>
      <div class="lesson-title">Knowledge Check Complete</div>
      <div class="score-big">${pct}%</div>
      <div class="score-label">${score} out of ${quizData.length} correct</div>
      <div style="margin:20px 0">
        <span class="badge badge-blue">${pass?'✓ Passed — 70% threshold met':'Review recommended — below 70%'}</span>
      </div>
      <p style="font-size:14px;color:var(--color-text-secondary);max-width:380px;margin:0 auto 24px;line-height:1.6">
        ${pass?'Great work! You have a solid grasp of the communication and professionalism content. Review any missed questions before exam day.':'Review the lessons for the questions you missed. Focus on ethical scenarios and de-escalation — these are common on the exam.'}
      </p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn-sec" onclick="retakeQuiz()">Retake test</button>
        <button class="btn-primary" onclick="go(11)">Continue →</button>
      </div>
    </div>`;
}

function retakeQuiz(){quizAnswers=[];quizStep=0;quizDone=false;selectedOpt=null;renderQuiz();}

function renderReflection(){
  const area = document.getElementById('main-area');
  area.innerHTML=`
    <div class="lesson-view">
      <div class="lesson-tag">Reflection</div>
      <div class="lesson-title">Reflect on what you've learned</div>
      <div class="lesson-sub">Consolidate your knowledge before moving on</div>
      <div class="section-h">Three things to ask yourself</div>
      <div class="card"><div class="card-title">What was most surprising?</div><div class="card-body">Was there a concept that challenged a habit you already had? Communication skills feel intuitive, but the professional standards — like never closing a ticket without user confirmation, or how to handle illegal content — are specific and testable.</div></div>
      <div class="card"><div class="card-title">Where might you struggle on the job?</div><div class="card-body">Most technicians find de-escalation hardest — it's natural to get defensive or rush to fix things. Identify your own tendencies and practice the frameworks: LAST, warm transfers, active restating.</div></div>
      <div class="card"><div class="card-title">What will you do differently?</div><div class="card-body">Pick one specific behavior change from this course. Maybe it's updating tickets in real time. Maybe it's following up with users 24 hours after a fix. One concrete change is worth more than memorizing all the concepts.</div></div>
      <div class="tip"><strong>You're ready. </strong>You've covered all 10 learning modules and completed the knowledge check. This material covers the communication and professionalism portion of Domain 4 of the CompTIA A+ Core 2 exam (220-1102). Good luck!</div>
    </div>
    <div class="bottom-bar">
      <button class="btn-sec" onclick="go(10)">← Review test</button>
      <span style="font-size:13px;color:var(--color-text-secondary)">Course complete 🎉</span>
    </div>`;
  completed.add(11);renderNav();
}

renderNav();
renderMain();
</script>
